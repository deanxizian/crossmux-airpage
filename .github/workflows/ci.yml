name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Chinese fonts
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - name: Install
        run: python -m pip install ".[test]"
      - name: Lint and format check
        run: |
          ruff check app tests
          ruff format --check app tests
      - name: Test
        run: pytest
      - name: Smoke-render native X3 assets
        env:
          OUTPUT_DIR: data
          AIRPAGE_ENABLED: "false"
          NEWS_API_BASE_URL: ""
        run: python -m app.cli --json
      - name: Build container
        run: docker build -t crossmux-airpage:test .
