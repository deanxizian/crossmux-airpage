name: Publish container

on:
  workflow_call:
    inputs:
      revision:
        required: true
        type: string
    outputs:
      image:
        description: "Immutable image reference built from the tested commit"
        value: ${{ jobs.publish.outputs.image }}

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.reference }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.revision }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=sha-${{ inputs.revision }}
            type=ref,event=tag
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - id: image
        name: Export tested image digest
        env:
          REPOSITORY: ${{ github.repository }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: printf 'reference=ghcr.io/%s@%s\n' "${REPOSITORY,,}" "$DIGEST" >> "$GITHUB_OUTPUT"
